name: CI/CD

# Push to main -> run checks, then deploy to the DigitalOcean droplet.
# Pull requests run the checks only (no deploy).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Never let two deploys run against the droplet at once. Queue instead.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint (ruff)
        run: pipx run --spec ruff==0.13.0 ruff check .

      - name: Build Docker image
        run: docker build -t traction-app:ci .

  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-latest
    needs: ci
    # Only deploy on a real push to main (or a manual run) - never on PRs.
    if: github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          SSH_HOST: ${{ secrets.DROPLET_HOST }}
          SSH_USER: ${{ secrets.DROPLET_USER }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
              "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/traction-app
          git fetch origin
          git reset --hard origin/main
          docker compose up -d --build
          docker image prune -f

          echo "Waiting for the app to report healthy..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "Healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after ~60s. Recent app logs:"
          docker compose logs --tail=50 app
          exit 1
          REMOTE
