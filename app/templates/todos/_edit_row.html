{% from "_macros.html" import people_options, team_select %}
<tr id="todo-row-{{ todo.id }}" class="row-edit">
  <td><input type="text" name="title" value="{{ todo.title }}" maxlength="255" required aria-label="Title"></td>
  <td>
    <select name="owner_id" aria-label="Owner">
      {{ people_options(people, selected=todo.owner_id, keep=todo.owner_id, keep_team=todo.team_id) }}
    </select>
  </td>
  <td>
    {{ team_select(teams, todo.team_id, id="todo-team-" ~ todo.id, filters='select[name="owner_id"], select[name="issue_id"]') }}
  </td>
  <td>
    <select name="issue_id" aria-label="Related issue">
      <option value="">— none —</option>
      {% for issue in org_issues %}
      <option value="{{ issue.id }}" data-teams="{{ issue.team_id }}" {% if issue.id == todo.issue_id %}selected{% endif %}>{{ issue.title }}</option>
      {% endfor %}
    </select>
  </td>
  <td><input type="date" name="due_date" value="{{ todo.due_date or '' }}" aria-label="Due"></td>
  <td>
    <select name="status" aria-label="Status">
      {% for choice in TodoStatus %}
      <option value="{{ choice.value }}" {% if choice == todo.status %}selected{% endif %}>{{ choice.value }}</option>
      {% endfor %}
    </select>
  </td>
  <td class="row-actions">
    <button class="link" hx-put="/todos/{{ todo.id }}" hx-include="closest tr"
            hx-target="#todo-row-{{ todo.id }}" hx-swap="outerHTML">Save</button>
    <button class="link-muted" hx-get="/todos/{{ todo.id }}"
            hx-target="#todo-row-{{ todo.id }}" hx-swap="outerHTML">Cancel</button>
  </td>
</tr>
