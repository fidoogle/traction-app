<tr id="issue-row-{{ issue.id }}">
  <td>{{ issue.title }}</td>
  <td>{{ issue.team.name }}</td>
  <td>{{ issue.priority }}</td>
  <td>
    {% if current_user.role.value == "viewer" %}
      <span class="badge {{ issue.status.value }}">{{ issue.status.value }}</span>
    {% else %}
      <select
        class="status-select"
        name="status"
        hx-patch="/issues/{{ issue.id }}/status"
        hx-target="#issue-row-{{ issue.id }}"
        hx-swap="outerHTML"
        hx-trigger="change"
      >
        {% for choice in IssueStatus %}
        <option value="{{ choice.value }}" {% if choice == issue.status %}selected{% endif %}>
          {{ choice.value }}
        </option>
        {% endfor %}
      </select>
    {% endif %}
  </td>
  {% if current_user.role.value == "admin" %}
  <td class="row-actions">
    <button
      class="link"
      hx-get="/issues/{{ issue.id }}/edit"
      hx-target="#issue-row-{{ issue.id }}"
      hx-swap="outerHTML"
    >
      Edit
    </button>
    <button
      class="link-danger"
      hx-delete="/issues/{{ issue.id }}"
      hx-target="#issue-row-{{ issue.id }}"
      hx-swap="delete"
      hx-confirm="Delete the issue &quot;{{ issue.title }}&quot;? Any to-dos linked to it are kept but unlinked. This cannot be undone."
    >
      Delete
    </button>
  </td>
  {% endif %}
</tr>
