<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Traction/EOS{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
  <script>
    document.addEventListener('htmx:configRequest', function (evt) {
      var match = document.cookie.match(/(?:^|; )csrf_token=([^;]*)/);
      if (match) {
        evt.detail.headers['X-CSRF-Token'] = decodeURIComponent(match[1]);
      }
    });
    // Delegated (not a direct getElementById+listener at parse time) so
    // this works regardless of where the script tag sits relative to the
    // button in the DOM - see the CSRF listener above for the same reason.
    document.addEventListener('click', function (evt) {
      var toggle = evt.target.closest('#nav-toggle');
      if (!toggle) return;
      var nav = document.getElementById('site-nav');
      var isOpen = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  </script>
</head>
<body>
  {% if current_user %}
  <div class="topbar">
    <a class="brand" href="/">Traction/EOS</a>
    <button
      type="button"
      id="nav-toggle"
      class="nav-toggle"
      aria-expanded="false"
      aria-controls="site-nav"
      aria-label="Toggle navigation"
    >
      <span class="nav-toggle-icon"></span>
    </button>
    <nav id="site-nav">
      <a href="/">Dashboard</a>
      <a href="/rocks">Rocks</a>
      <a href="/scorecard">Scorecard</a>
      <a href="/issues">Issues</a>
      <a href="/todos">To-Dos</a>
      <a href="/meetings">Meetings</a>
      <a href="/seats">Org Chart</a>
      <a href="/vto">VTO</a>
      <a href="/people-analyzer">People Analyzer</a>
      <a href="/teams">Teams</a>
      <a href="/users">Users</a>
      <span class="user-info">{{ current_user.name }} &middot; {{ current_user.role.value }}</span>
      <form class="logout-form" method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
        <button type="submit">Log out</button>
      </form>
    </nav>
  </div>
  {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
