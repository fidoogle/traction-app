{# Body of the global quick-add modal (see base.html). Ids are prefixed qa- so
   they can't collide with the add forms on the Issues / To-Dos pages. #}
<div class="segmented" role="tablist">
  <button type="button" role="tab" class="active" aria-selected="true" data-qa-tab="issue">Issue</button>
  <button type="button" role="tab" aria-selected="false" data-qa-tab="todo">To-Do</button>
</div>

<form data-qa-panel="issue" data-qa-kind="issue" hx-post="/issues" hx-swap="none">
  <div class="field">
    <label for="qa-issue-title">Title</label>
    <input type="text" id="qa-issue-title" name="title" required maxlength="255" autofocus>
  </div>
  <div class="field">
    <label for="qa-issue-team">Team</label>
    <select id="qa-issue-team" name="team_id" required>
      {% for team in teams %}
      <option value="{{ team.id }}" {% if team.id == current_user.team_id %}selected{% endif %}>{{ team.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="qa-issue-priority">Priority</label>
    <input type="number" id="qa-issue-priority" name="priority" value="0">
  </div>
  <div class="modal-actions">
    <button type="button" class="secondary" data-modal-close>Cancel</button>
    <button type="submit" class="primary">Add issue</button>
  </div>
</form>

<form data-qa-panel="todo" data-qa-kind="todo" hx-post="/todos" hx-swap="none" hidden>
  <div class="field">
    <label for="qa-todo-title">Title</label>
    <input type="text" id="qa-todo-title" name="title" required maxlength="255">
  </div>
  <div class="field">
    <label for="qa-todo-owner">Owner</label>
    <select id="qa-todo-owner" name="owner_id" required>
      {% for user in org_users %}
      <option value="{{ user.id }}" {% if user.id == current_user.id %}selected{% endif %}>{{ user.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="qa-todo-issue">Related issue (optional)</label>
    <select id="qa-todo-issue" name="issue_id">
      <option value="">— none —</option>
      {% for issue in org_issues %}
      <option value="{{ issue.id }}">{{ issue.title }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="qa-todo-due">Due</label>
    <input type="date" id="qa-todo-due" name="due_date">
  </div>
  <div class="modal-actions">
    <button type="button" class="secondary" data-modal-close>Cancel</button>
    <button type="submit" class="primary">Add to-do</button>
  </div>
</form>
