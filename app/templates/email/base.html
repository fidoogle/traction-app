{# Shared layout for HTML emails. Inline styles only: mail clients ignore
   <style> blocks and nothing is loaded from a remote host. #}
<!doctype html>
<html>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;">
    <tr><td align="center" style="padding:24px 12px;">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:6px;">
        <tr><td style="padding:24px 28px;font-size:15px;line-height:1.5;">
          {% block body %}{% endblock %}
        </td></tr>
        <tr><td style="padding:14px 28px;border-top:1px solid #e4e7eb;font-size:12px;color:#7b8794;">
          {% block footer %}Sent by your district's Traction app.{% if always_on %} This is an account email, so it can't be turned off.{% endif %}{% if preferences_url %} <a href="{{ preferences_url }}" style="color:#7b8794;">Choose which emails you get</a>.{% endif %}{% endblock %}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
