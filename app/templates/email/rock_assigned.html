{% extends "base.html" %}
{% block body %}
<h2 style="margin-top:0;">New Rock</h2>
<p>Hi {{ name }},</p>
<p>{{ assigned_by }} made you the owner of a Rock on {{ team }} for {{ quarter }}:</p>
<p style="margin:16px 0;padding:12px 16px;background:#f4f5f7;border-radius:4px;"><strong>{{ title }}</strong></p>
<p><a href="{{ link }}" style="display:inline-block;padding:10px 18px;background:#2b6cb0;color:#ffffff;text-decoration:none;border-radius:4px;">See your Rocks</a></p>
{% endblock %}
