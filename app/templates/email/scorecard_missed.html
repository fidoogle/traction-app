{% extends "base.html" %}
{% block body %}
<h2 style="margin-top:0;">Scorecard number below goal</h2>
<p>Hi {{ name }},</p>
<p><strong>{{ measure }}</strong> on {{ team }} has missed its goal ({{ goal }}) {{ streak }} weeks in a row:</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:12px 0;">
  {% for r in results %}
  <tr><td style="padding:6px 0;border-top:1px solid #e4e7eb;">{{ r.week }}</td><td align="right" style="color:#b83232;"><strong>{{ r.actual }}</strong></td></tr>
  {% endfor %}
</table>
<p style="color:#52606d;">Owner: {{ owner }}</p>
<p><a href="{{ link }}" style="display:inline-block;padding:10px 18px;background:#2b6cb0;color:#ffffff;text-decoration:none;border-radius:4px;">See the scorecards</a></p>
{% endblock %}
