{% extends "base.html" %}
{% block body %}
<h2 style="margin-top:0;">Meeting reminder</h2>
<p>Hi {{ name }},</p>
<p>The {{ team }} meeting is {{ lead }}.</p>
<p style="margin:16px 0;padding:12px 16px;background:#f4f5f7;border-radius:4px;">
  <strong>{{ when }}</strong>{% if location %}<br><span style="color:#52606d;">{{ location }}</span>{% endif %}
</p>
<p><a href="{{ link }}" style="display:inline-block;padding:10px 18px;background:#2b6cb0;color:#ffffff;text-decoration:none;border-radius:4px;">Meetings in Traction</a></p>
{% endblock %}
