<tr id="rock-row-{{ rock.id }}" class="row-edit">
  <td><input type="text" name="title" value="{{ rock.title }}" maxlength="255" required aria-label="Title"></td>
  <td>
    <select name="owner_id" aria-label="Owner">
      {% for user in users %}
      <option value="{{ user.id }}" {% if user.id == rock.owner_id %}selected{% endif %}>{{ user.name }}</option>
      {% endfor %}
    </select>
  </td>
  <td>
    <select name="team_id" aria-label="Team">
      {% for team in teams %}
      <option value="{{ team.id }}" {% if team.id == rock.team_id %}selected{% endif %}>{{ team.name }}</option>
      {% endfor %}
    </select>
  </td>
  <td><input type="text" name="quarter" value="{{ rock.quarter }}" maxlength="10" required aria-label="Quarter"></td>
  <td>
    <select name="status" aria-label="Status">
      {% for choice in RockStatus %}
      <option value="{{ choice.value }}" {% if choice == rock.status %}selected{% endif %}>
        {{ choice.value.replace("_", " ") }}
      </option>
      {% endfor %}
    </select>
  </td>
  <td class="row-actions">
    <button
      class="link"
      hx-put="/rocks/{{ rock.id }}"
      hx-include="closest tr"
      hx-target="#rock-row-{{ rock.id }}"
      hx-swap="outerHTML"
    >
      Save
    </button>
    <button
      class="link-muted"
      hx-get="/rocks/{{ rock.id }}"
      hx-target="#rock-row-{{ rock.id }}"
      hx-swap="outerHTML"
    >
      Cancel
    </button>
  </td>
</tr>
