services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: traction
      POSTGRES_PASSWORD: traction
      POSTGRES_DB: traction
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traction -d traction"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
